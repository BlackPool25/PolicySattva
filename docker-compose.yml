version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: policysattva-backend
    ports:
      - "8008:8000"
    volumes:
      - ./backend/rag_storage:/app/rag_storage
      - ./backend/documents:/app/documents
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NEO4J_URI=neo4j://neo4j:7687
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8008
    container_name: policysattva-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:8008
    depends_on:
      - backend

  neo4j:
    image: neo4j:5.15-community
    container_name: policysattva-neo4j
    environment:
      - NEO4J_AUTH=neo4j/policysattva_password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p policysattva_password 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: policysattva-redis

volumes:
  neo4j_data:
  neo4j_logs:


